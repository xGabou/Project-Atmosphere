modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "assets/projectatmosphere/icon.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
mandatory = true
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "sereneseasons"
mandatory = true
versionRange = "*"
ordering = "AFTER"
side = "BOTH"


[[dependencies."${mod_id}"]]
modId = "sereneseasonsplus"
mandatory = true
versionRange = "*"
side = "BOTH"


[[dependencies."${mod_id}"]]
modId = "simpleclouds"
mandatory = true
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

