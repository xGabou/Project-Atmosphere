def releaseJarFile = layout.buildDirectory.file("libs/Forge-${mod_id}-${project.version}.jar")

tasks.register("discordWebhook") {
    doLast {
        def webhookUrl = System.getenv("DISCORD_WEBHOOK_URL")?.trim()
        if (!webhookUrl) {
            println "Skipping Discord webhook notification: DISCORD_WEBHOOK_URL not set."
            return
        }

        def changelogText = rootProject.file("PAchangelog.md").text

        def payload = [
                username        : "Build Bot",
                allowed_mentions: [parse: ["roles"]],
                content         : "**New release published!** 🎉\n" +
                        "<@&1401956072784269443>\n" + // role mention
                        "Project: ${mod_name}\n" +
                        "Version: v${project.mod_version}-1.20.1\n\n" +
                        "${changelogText.take(1891)}"
        ]

        println "Sending release notification to Discord..."
        def connection = new URL(webhookUrl).openConnection()
        connection.with {
            doOutput = true
            requestMethod = "POST"
            setRequestProperty("Content-Type", "application/json")
            outputStream.withWriter("UTF-8") { it << JsonOutput.toJson(payload) }
            println "Webhook sent with response code: ${responseCode}"
        }
    }
}
