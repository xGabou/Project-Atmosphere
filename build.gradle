tasks.register('architectureBoundaryCheck') {
    group = 'verification'
    description = 'Prevents loader networking and ForgeConfigSpec access from leaking back into migrated domain code.'

    doLast {
        def sourceRoot = file('src/main/java')
        def violations = []
        fileTree(sourceRoot) { include '**/*.java' }.files.each { sourceFile ->
            def relative = sourceRoot.toPath().relativize(sourceFile.toPath()).toString().replace('\\', '/')
            def text = sourceFile.getText('UTF-8')
            def networkAdapter = relative.startsWith('net/Gabou/projectatmosphere/platform/network/')
                    || relative == 'net/Gabou/projectatmosphere/network/NetworkHandler.java'
            if (!networkAdapter && (text.contains('net.minecraftforge.network')
                    || text.contains('NetworkHandler.CHANNEL')
                    || text.contains('PacketDistributor'))) {
                violations << "Forge networking leaked into ${relative}"
            }

            def migratedCloudDomain = relative.startsWith('net/Gabou/projectatmosphere/clouds/')
                    && !relative.startsWith('net/Gabou/projectatmosphere/clouds/client/render/')
            if (migratedCloudDomain && text.contains('AtmoCommonConfig')) {
                violations << "Forge config access leaked into ${relative}"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(violations.join(System.lineSeparator()))
        }
    }
}

tasks.named('check').configure {
