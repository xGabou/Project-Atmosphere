        [name: 'cloud_atmosphere_volume_t168_fp_aggressive',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0'],
         keepUniforms: ['PaOracleBaseSize']],
        // Combined stacks: a footprint curve plus the reconfirmed termination
        // floor. Two, so the winning curve is not guessed before the run.
        [name: 'cloud_atmosphere_volume_t168_stack',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.35',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t168_stack_balanced',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.50',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045'],
         keepUniforms: ['PaOracleBaseSize']],

        // ------------------------------------------------------------------
        // T169. Lighting and detail, the workload T168 pointed at: SIDE spends
        // 14.83 light and 35.99 detail evaluations per pixel against FAR's
        // 1.74 and 4.57.
        //
        // Tap reduction is deliberately conservative. The earlier global
        // 6 -> 2 cut was fast and visibly flattened self-shadowing, so 5 and 4
        // are measured separately instead of repeating it.
        // ------------------------------------------------------------------
        [name: 'cloud_atmosphere_volume_t169_lightsteps5',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_LIGHT_STEPS 5'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t169_lightsteps4',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_LIGHT_STEPS 4'],
         keepUniforms: []],
        // Cone early-out at the validated transmittance floor rather than the
        // 28.0 optical depth no exterior cone ever reaches.
        [name: 'cloud_atmosphere_volume_t169_lightearlyout2',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_LIGHT_EARLY_OUT 2.0'],
         keepUniforms: []],

        // Detail gated by projected footprint - the T168 relation applied to
        // the detail wavelength. PaOracleBaseSize carries the live target
        // height the derivation needs and must survive specialization.
        [name: 'cloud_atmosphere_volume_t169_detailfp_conservative',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DETAIL_FOOTPRINT 0.5'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t169_detailfp_balanced',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DETAIL_FOOTPRINT 1.0'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t169_detailfp_aggressive',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DETAIL_FOOTPRINT 1.5'],
         keepUniforms: ['PaOracleBaseSize']],
        // Ceiling: all detail removed. Not shippable, it bounds what any
        // detail LOD can return.
        [name: 'cloud_atmosphere_volume_t169_nodetail',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_NO_DETAIL 1'],
         keepUniforms: []],

        // Task 5 stacks. Both carry the T168 winners plus the lighting and
        // detail candidates, so the combination is measured rather than
        // multiplied out of the independent arms.
        [name: 'cloud_atmosphere_volume_t169_stack_safe',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.35',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 5'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t169_stack_fast',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4'],
         keepUniforms: ['PaOracleBaseSize']],

        // ------------------------------------------------------------------
        // T170. The primary march. T169 bounded lighting at 19.5% and detail
        // at 15.2% of SIDE cloud cost; with both removed SIDE would still cost
        // ~14.7 ms against a 10 ms budget, so what remains is the march and
        // the descriptor work each primary density sample pays.
        //
        // Task 1 - is PA_ARM_FOOTPRINT_MAX limiting SIDE? The clamp caps the
        // step multiplier at clamp(coefficient * t, 1.0, MAX). At the SIDE
        // pose the storm sits ~914 m out and the march runs to ~1600 m, so
        // with P=0.75 the unclamped multiplier passes 4 at roughly t=1030 and
        // the clamp binds over most of the traversal. The sweep measures
        // whether releasing it keeps paying, and what it costs structurally.
        // The projected-footprint formulation itself is unchanged; only the
        // ceiling moves, so no arithmetic enters the inner loop.
        // ------------------------------------------------------------------
        // Run 2 sweeps the clamp DOWN. Run 1 showed max5/max6/max8 rendering
        // identical images - the clamp no longer binds above ~5 - while max4,
        // where it does bind, was 41% faster at FAR than any of them. The
        // ceiling was never the limit; the step growth itself is.
        [name: 'cloud_atmosphere_volume_t170_fpmax3',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 3.0', 'PA_ARM_EARLY_TERM 0.045'],
         keepUniforms: ['PaOracleBaseSize']],
        // Ceiling, not a candidate: PA_ARM_DESC_HOIST substitutes a constant
        // edge width and so renders an invalid image. A real hoist computes
        // the same value once per descriptor per frame and is image-identical.
        // This measures whether the stack plus a perfect hoist reaches budget.
        [name: 'cloud_atmosphere_volume_t170_stack_hoist',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_HOIST 1'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t170_stack3',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 3.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t170_fpmax4',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t170_fpmax5',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 5.0', 'PA_ARM_EARLY_TERM 0.045'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t170_fpmax6',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 6.0', 'PA_ARM_EARLY_TERM 0.045'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t170_fpmax8',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 8.0', 'PA_ARM_EARLY_TERM 0.045'],
         keepUniforms: ['PaOracleBaseSize']],

        // Tasks 2/3/4 - attribution of what a primary density sample pays per
        // descriptor. Each arm removes exactly one stage of the group walk and
        // keeps the iteration count and control shape intact, so the deltas
        // are attributable and, where they overlap, comparably measured.
        //
        // Every one of these is visually invalid by construction. They bound
        // cost; none is a production candidate, and the sandbox invariant
        // keeps all of them out of FINAL.
        [name: 'cloud_atmosphere_volume_t170_desc_constfetch',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_CONST_FETCH 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t170_desc_constedge',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_CONST_EDGE 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t170_desc_cheapowner',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_CHEAP_OWNERSHIP 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t170_desc_nosdf',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_NO_EXACT_SDF 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t170_desc_hardunion',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_HARD_UNION 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t170_desc_hoist',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_HOIST 1'],
         keepUniforms: []],

        // Task 6 stacks. T169's stack_fast carried forward unchanged except
        // for the clamp, so the campaign's own lever is the only difference
        // from the banked configuration. Two, so the clamp is not guessed
        // before the sweep reports.
        [name: 'cloud_atmosphere_volume_t170_stack',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 6.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4'],
         keepUniforms: ['PaOracleBaseSize']],
        // ------------------------------------------------------------------
        // T171 program-identity controls. Exactly FINAL's defines and
        // keepUniforms, so the generated GLSL differs from
        // cloud_atmosphere_volume_final.fsh only in its file name. Two of them,
        // separately linked, so "same logic, different GL program" can be
        // separated from "same GL program, measured twice".
        // ------------------------------------------------------------------
        // ------------------------------------------------------------------
        // T172. The real hoist. T170's desc_constedge and desc_hoist bounded
        // what removing the invariant arithmetic was worth by substituting
        // constants, which made them fast and visually wrong. These read the
        // identical values from texel 3, where the CPU wrote them when the
        // descriptor was built, so they must be image-equivalent as well as
        // faster - and the campaign checks both.
        // ------------------------------------------------------------------
        // ------------------------------------------------------------------
        // T173. The T121 bound. PA_ARM_BOX_BOUND forces paT141BoxBound() true
        // at compile time, which is the only way to reach it: FINAL bakes
        // PaDiagnosticOptimizationMode to 0, so the shipped renderer uses the
        // vertical-only bound and the tighter one is dead code.
        //
        // Exact by construction - max() of two valid lower bounds is a valid
        // lower bound - so these must render bit-identically and differ only in
        // how many descriptors reach the exact SDF.
        // ------------------------------------------------------------------
        // ------------------------------------------------------------------
        // T174 group-entry ceilings. Both carry FINAL's specialization,
        // including the now-productionized precompute, so they differ from the
        // shipped program only in what they do at group level.
        //
        // Both are visually invalid by construction and neither is a candidate.
        // They exist to price the group-entry line before any group metadata is
        // designed, because there is currently none to reject on.
        // ------------------------------------------------------------------
        // ------------------------------------------------------------------
        // T175. Both carry FINAL's specialization, precompute included, so they
        // differ from the shipped program only in the one thing each names.
        // Both are visually invalid or unsafe by construction and neither is a
        // candidate; they exist to decide between empty-space skipping and
        // occupied-space sampling reduction before either is designed.
        // ------------------------------------------------------------------
        // ------------------------------------------------------------------
        // T176 light-march ceilings, all carrying FINAL's specialization
        // including the productionized precompute, so they differ from the
        // shipped program only in the lighting lever each names.
        // ------------------------------------------------------------------
        [name: 'cloud_atmosphere_volume_t176_nolight',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: [],
         overrides: ['uniform int PaDiagnosticLightingMode;':
                     'const int PaDiagnosticLightingMode = 1;']],
        [name: 'cloud_atmosphere_volume_t176_light3',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_LIGHT_STEPS 3'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t176_light2',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_LIGHT_STEPS 2'],
         keepUniforms: []],

        [name: 'cloud_atmosphere_volume_t175_density_every2',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_DENSITY_EVERY_2 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t175_clearance_first_group',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_CLEARANCE_FIRST_GROUP 1'],
         keepUniforms: []],

        [name: 'cloud_atmosphere_volume_t174_first_group_only',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_FIRST_GROUP_ONLY 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t174_group2_no_sdf',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_GROUP2_NO_SDF 1'],
         keepUniforms: []],

        [name: 'cloud_atmosphere_volume_t173_boxbound',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_BOX_BOUND 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t173_boxbound_pre',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_BOX_BOUND 1',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t173_stack_boxbound_pre',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_BOX_BOUND 1'],
         keepUniforms: ['PaOracleBaseSize']],

        [name: 'cloud_atmosphere_volume_t172_pre_edge',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE_EDGE 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t172_pre_owner',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE_OWNER 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t172_pre_both',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: []],
        // The validated T169 stack with the precompute added, which is the
        // configuration that would actually ship.
        [name: 'cloud_atmosphere_volume_t172_stack_pre',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaOracleBaseSize']],

        // T176 Task 8. The stack bakes PA_ARM_LIGHT_STEPS 4, which the
        // inside-slab cap already forces, so the validated stack carries no
        // light reduction at all. These price the light march ON the stack,
        // because the brief forbids inferring stack speedups by multiplying
        // anchor-relative ratios.
        [name: 'cloud_atmosphere_volume_t176_stack_nolight',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaOracleBaseSize'],
         overrides: ['uniform int PaDiagnosticLightingMode;':
                     'const int PaDiagnosticLightingMode = 1;']],
        [name: 'cloud_atmosphere_volume_t176_stack_light3',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 3',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaOracleBaseSize']],
        // T188 Task 0. The rain-only capture pair. These render the rain
        // contribution alone - optical mass, onset and termination height, and
        // the run count that exposes a broken shaft - instead of the composited
        // frame, because rain and cloud cannot be separated after compositing.
        //
        // Diagnostic and temporary: they exist to gate the field on rain
        // quality and should be removed with the campaign. The mask output is
        // behind a define rather than a DebugView because every lean program
        // bakes DebugView to 0, so a runtime view could only ever be rendered
        // by the monolith - and the arms are exactly what has to be measured.
        [name: 'cloud_atmosphere_volume_t188_rain_mask_ref',
         defines: ['PA_ARM_DESC_PRECOMPUTE 1', 'PA_RAIN_MASK_OUTPUT 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t188_rain_mask_field',
         defines: ['PA_ARM_DESC_PRECOMPUTE 1', 'PA_RAIN_MASK_OUTPUT 1',
                   'PA_ARM_RAIN_OWN_BILINEAR 1'],
         keepUniforms: ['PaRainFieldPass', 'PaRainFieldEnabled']],

        // T190. The conservative field: the build marks every cell whose
        // rain-existence decision it cannot prove uniform across the cell, and
        // those cells are answered by the exact evaluation instead. Three arms
        // only - the field, its stack, and the rain-only capture - because the
        // variant count is already near the level that failed a shader load.
        [name: 'cloud_atmosphere_volume_t190_field_safe',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaRainFieldPass', 'PaRainFieldEnabled',
                        'PaRainFieldConservative']],
        [name: 'cloud_atmosphere_volume_t190_stack_safe',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaOracleBaseSize', 'PaRainFieldPass',
                        'PaRainFieldEnabled', 'PaRainFieldConservative']],
        [name: 'cloud_atmosphere_volume_t190_rain_mask_safe',
         defines: ['PA_ARM_DESC_PRECOMPUTE 1', 'PA_RAIN_MASK_OUTPUT 1'],
         keepUniforms: ['PaRainFieldPass', 'PaRainFieldEnabled',
                        'PaRainFieldConservative']],

        // T189. Ownership fetched discretely with texelFetch while support and
        // attach height keep their filtering. This is the candidate; the two
        // T188 arms above are the same field with the bilinear ownership that
        // produced 10.6-15.6% false rain, kept so the fix has a baseline.
        [name: 'cloud_atmosphere_volume_t189_field_nearest',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaRainFieldPass', 'PaRainFieldEnabled']],
        [name: 'cloud_atmosphere_volume_t189_stack_nearest',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaOracleBaseSize', 'PaRainFieldPass',
                        'PaRainFieldEnabled']],
        [name: 'cloud_atmosphere_volume_t189_rain_mask_nearest',
         defines: ['PA_ARM_DESC_PRECOMPUTE 1', 'PA_RAIN_MASK_OUTPUT 1'],
         keepUniforms: ['PaRainFieldPass', 'PaRainFieldEnabled']],
        // Task 5 diagnostic: the erosion side of the same trade, so dilation
        // and erosion are priced against each other rather than one being
        // assumed worse. Never a production candidate - a threshold is a tuning
        // knob standing in for a type error.
        [name: 'cloud_atmosphere_volume_t189_rain_mask_strict',
         defines: ['PA_ARM_DESC_PRECOMPUTE 1', 'PA_RAIN_MASK_OUTPUT 1',
                   'PA_ARM_RAIN_OWN_STRICT 1'],
         keepUniforms: ['PaRainFieldPass', 'PaRainFieldEnabled']],

        // T188. The REAL rain-support field. The generation pass and the
        // lookup are the same program, so both uniforms stay live; the field
        // itself is written by the untimed generation draw the renderer issues
        // before the march, exactly as T153's ground-truth pass does.
        //
        // Both are campaign variants, not production programs: FINAL bakes
        // PaRainFieldPass and PaRainFieldEnabled to 0 and is unchanged.
        [name: 'cloud_atmosphere_volume_t188_field_real',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_RAIN_OWN_BILINEAR 1'],
         keepUniforms: ['PaRainFieldPass', 'PaRainFieldEnabled']],
        // The exactness arm. It generates the field and still marches the exact
        // descriptor path, so one frame carries both the ground truth and the
        // field that has to reproduce it.
        [name: 'cloud_atmosphere_volume_t188_field_generate_only',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaRainFieldPass']],
        [name: 'cloud_atmosphere_volume_t188_stack_field',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaOracleBaseSize', 'PaRainFieldPass',
                        'PaRainFieldEnabled']],

        // T187. The rain-field architectural ceiling: the descriptor traversal
        // inside localRainSupportAt becomes free, which is the most any
        // precomputed field could achieve since a real lookup costs more than
        // nothing. Image-invalid by construction; a bound, not a candidate.
        [name: 'cloud_atmosphere_volume_t187_field_oracle',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_RAIN_FIELD_ORACLE 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t187_stack_field',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_RAIN_FIELD_ORACLE 1'],
         keepUniforms: ['PaOracleBaseSize']],

        // T186. One rain-support sample per coarse segment instead of two.
        // The rule is an existence test, so dropping a sample can only turn
        // true into false - it can miss rain, never invent it. The midpoint is
        // the least biased single probe; the two Gauss nodes bound the bias
        // either way.
        [name: 'cloud_atmosphere_volume_t186_one_mid',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_RAIN_ONE_MID 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t186_one_a',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_RAIN_ONE_A 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t186_one_b',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_RAIN_ONE_B 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t186_stack_one_mid',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_RAIN_ONE_MID 1'],
         keepUniforms: ['PaOracleBaseSize']],

        // T185. The rain ownership prune. The shipped envelope stacks three
        // conservative steps - ellipse to square, squares to AABB, AABB to
        // circumcircle - and the tight arm removes the last two while keeping
        // the same guarantee. The exact arm bounds what any geometric prune
        // could return.
        [name: 'cloud_atmosphere_volume_t185_tight_prune',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_RAIN_TIGHT_PRUNE 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t185_exact_prune',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_RAIN_EXACT_PRUNE 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t185_stack_tight',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_RAIN_TIGHT_PRUNE 1'],
         keepUniforms: ['PaOracleBaseSize']],

        // T184. A one-entry cache on localRainSupportAt keyed on exact XZ
        // equality. Exact by construction: the function is a pure function of
        // worldXZ within a frame, so an identical XZ must yield an identical
        // result. Rain rendering is untouched.
        [name: 'cloud_atmosphere_volume_t184_reuse_exact',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_RAIN_REUSE_EXACT 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t184_stack_reuse',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_RAIN_REUSE_EXACT 1'],
         keepUniforms: ['PaOracleBaseSize']],

        // T182. The rain-segment reachability test runs on every coarse step
        // and, past its MaxPrecipitation gate, performs two full storm
        // traversals. Removing it uniformly prices the class the T180/T181
        // residual was hiding in.
        [name: 'cloud_atmosphere_volume_t182_norainseg',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_NO_RAIN_SEGMENT 1'],
         keepUniforms: []],
        // Task 8: the best measured probe cap, composed with the stack.
        [name: 'cloud_atmosphere_volume_t182_stack_probe4',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_PROBE_CAP 4'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t182_stack_probe4_norainseg',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_PROBE_CAP 4',
                   'PA_ARM_NO_RAIN_SEGMENT 1'],
         keepUniforms: ['PaOracleBaseSize']],

        // T181. Uniform compile-time caps on the empty-span scan. The loop
        // already exits on material or span end, so these only bind on scans
        // that would have run longer - which is the thing being measured.
        [name: 'cloud_atmosphere_volume_t181_probe8',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_PROBE_CAP 8'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t181_probe4',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_PROBE_CAP 4'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t181_probe2',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_PROBE_CAP 2'],
         keepUniforms: []],
        // Mandatory: the refinement is 32% of group walks and has never been
        // priced. Removing it leaves no clearance to advance on.
        [name: 'cloud_atmosphere_volume_t181_norefine',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_NO_REFINE 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t181_stack_probe8',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_PROBE_CAP 8'],
         keepUniforms: ['PaOracleBaseSize']],

        // T180. The empty-span probe scan and the bracket bisection are the
        // two production consumers T175's "48%" was actually made of. Both ask
        // only whether density exceeds 0.0008, and both are removed here
        // uniformly at compile time - the shape T179 showed is the only one that
        // pays - to bound what each class is worth.
        [name: 'cloud_atmosphere_volume_t180_noprobe',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_NO_PROBE 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t180_nobracket',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_NO_BRACKET 1'],
         keepUniforms: []],
        // The cheaper-query candidate: probes keep running but drop the
        // subtractive detail erosion, which can only raise the value they test
        // and so can never let the scan advance over material.
        [name: 'cloud_atmosphere_volume_t180_probe_nodetail',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_PROBE_NO_DETAIL 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t180_stack_probe',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_PROBE_NO_DETAIL 1'],
         keepUniforms: ['PaOracleBaseSize']],

        // T179. Dominance pruning. The rejection threshold drops from the
        // global blend cap (48 blocks) to the exact blend radius the ordered
        // union will use for this pair, which is what stormSmoothMinimum's
        // h == 1 condition actually requires. No new payload, no division, no
        // ranking - the blend is hoisted from the union below and reused.
        [name: 'cloud_atmosphere_volume_t179_dom_exact',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_DOMINANCE_EXACT 1'],
         keepUniforms: []],
        // The family ceiling: no blend margin at all. Rejects lobes that do move
        // the union through the blend band, so it is image-invalid by
        // construction and bounds the idea rather than implementing it.
        [name: 'cloud_atmosphere_volume_t179_dom_aggressive',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_DOMINANCE_AGGRESSIVE 1'],
         keepUniforms: []],
        // Task 9's fresh stack: the validated components, no light3.
        [name: 'cloud_atmosphere_volume_t179_stack_dom',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_DOMINANCE_EXACT 1'],
         keepUniforms: ['PaOracleBaseSize']],

        // T177. Hard primary-to-light group reuse, alone and on the stack.
        [name: 'cloud_atmosphere_volume_t177_reuse_hard',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1',
                   'PA_ARM_LIGHT_REUSE_HARD 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t177_stack_reuse_hard',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 3',
                   'PA_ARM_DESC_PRECOMPUTE 1', 'PA_ARM_LIGHT_REUSE_HARD 1'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t176_stack_light2',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 4.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 2',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaOracleBaseSize']],

        // These must track FINAL's specialization exactly - including the
        // T174-productionized precompute - or they stop isolating program
        // identity and start measuring a shader difference instead. The T171
        // invariant asserts byte-identity and caught this the moment FINAL
        // changed.
        [name: 'cloud_atmosphere_volume_t171_dup_a',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t171_dup_b',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: []],

        [name: 'cloud_atmosphere_volume_t170_stack8',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.75',
                   'PA_ARM_FOOTPRINT_MAX 8.0', 'PA_ARM_EARLY_TERM 0.045',
                   'PA_ARM_DETAIL_FOOTPRINT 1.0', 'PA_ARM_LIGHT_STEPS 4'],
         keepUniforms: ['PaOracleBaseSize']]
]

tasks.register('generateLeanFinalShader') {
    description = 'Generates the lean FINAL cloud program and the T140 oracle variants.'
    inputs.files(leanFinalShaderSource, leanFinalShaderJson)
    inputs.property('leanConstants', leanFinalConstants.toString())
    inputs.property('leanProgramName', leanFinalShaderName)
    inputs.property('leanRemovedSamplers', leanFinalRemovedSamplers.toString())
    inputs.property('leanVariants', leanProgramVariants.toString())
    outputs.dir(leanFinalGeneratedResources)
    doLast {
        File shaderDirectory = new File(
                leanFinalGeneratedResources.get().asFile,
                'assets/projectatmosphere/shaders/core')
        shaderDirectory.mkdirs()

        String productionSource = leanFinalShaderSource.getText('UTF-8')
        def productionJson = new groovy.json.JsonSlurper().parse(leanFinalShaderJson, 'UTF-8')

        leanProgramVariants.each { variant ->
            String programName = variant.name
            List<String> keep = variant.keepUniforms
            String variantSource = productionSource
            List<String> baked = []
            // A variant may bake a uniform to a different constant than FINAL
            // does; that is how a production-context arm switches one cost
            // class off without introducing a runtime branch.
            Map<String, String> variantConstants = new LinkedHashMap<>(leanFinalConstants)
            if (variant.overrides != null) {
                variantConstants.putAll(variant.overrides)
            }
            variantConstants.each { String uniformDeclaration, String constantDeclaration ->
                String uniformName = uniformDeclaration
                        .replaceAll(/^uniform\s+\w+\s+/, '').replaceAll(/;$/, '')
                if (keep.contains(uniformName)) {
                    return
                }
                // A silently missed replacement would emit a program identical
                // to the monolith and quietly lose the entire gain, so a
                // renamed or reformatted declaration must fail the build.
                if (!variantSource.contains(uniformDeclaration)) {
                    throw new GradleException(
                            'Lean specialization could not find uniform declaration: '
                                    + uniformDeclaration
                                    + ' in cloud_atmosphere_volume.fsh. Update'
                                    + ' leanFinalConstants in build.gradle and'
                                    + ' leanFinalEligible() in VolumetricCloudRenderer'
                                    + ' together.')
                }
                variantSource = variantSource.replace(
                        uniformDeclaration, constantDeclaration)
                baked.add(uniformName)
            }

            if (!variant.defines.isEmpty()) {
                // The defines must precede every use, and #version must stay
                // the first line of the program.
                String versionLine = '#version 150'
                if (!variantSource.startsWith(versionLine)) {
                    throw new GradleException(
                            'cloud_atmosphere_volume.fsh must start with ' + versionLine)
                }
                String defineBlock = variant.defines
                        .collect { '#define ' + it }.join('\n')
                variantSource = versionLine + '\n' + defineBlock +
                        variantSource.substring(versionLine.length())
            }

            new File(shaderDirectory, programName + '.fsh').setText(
                    '// GENERATED - do not edit. Emitted from'
                            + ' cloud_atmosphere_volume.fsh by generateLeanFinalShader.\n'
                            + '// Dormant diagnostic selectors are constants here, so the driver\n'
                            + '// eliminates those paths before allocating registers.\n'
                            + (variant.defines.isEmpty()
                                ? ''
                                : '// Variant defines: ' + variant.defines.join(', ') + '\n')
                            + variantSource,
                    'UTF-8')

            def variantJson = new groovy.json.JsonSlurper().parseText(
                    groovy.json.JsonOutput.toJson(productionJson))
            variantJson.fragment = 'projectatmosphere:' + programName
            variantJson.uniforms = variantJson.uniforms.findAll { !baked.contains(it.name) }
            // A variant that keeps PaOraclePass as a uniform still reads the
            // oracle texture, so its sampler must survive the strip that exists
            // only because FINAL provably never reads it.
            List<String> keptSamplers = variant.keepSamplers == null
                    ? [] : variant.keepSamplers
            variantJson.samplers = variantJson.samplers.findAll {
                keptSamplers.contains(it.name) || !leanFinalRemovedSamplers.contains(it.name)
            }
            new File(shaderDirectory, programName + '.json').setText(
                    groovy.json.JsonOutput.prettyPrint(
                            groovy.json.JsonOutput.toJson(variantJson)),
                    'UTF-8')
        }
    }
}

