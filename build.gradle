import groovy.json.JsonOutput

plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.matthewprenger.cursegradle' version '1.4.0' // CurseForge uploader
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
    id 'maven-publish'
}

group = mod_group_id
version = mod_version

def githubPackagesUser = (System.getenv("GITHUB_USER") ?: System.getenv("GITHUB_ACTOR"))?.trim()
def githubPackagesToken = System.getenv("GITHUB_TOKEN")?.trim()
def hasGithubPackagesCredentials = githubPackagesUser && githubPackagesToken

base {
    archivesName = "Forge-" + mod_id
}


java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')


    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            // Benchmark-owned heap cap. Opt-in only: without -PpaBenchHeap the
            // dev client keeps stock JVM ergonomics, so ordinary `runClient` is
            // untouched. The stock ergonomic Xmx on this 32 GB host is 7.93 GB
            // (MaxHeapSize=8510242816) with Xms 508 MB, which lets G1 drift the
            // committed heap far above the live set during a long campaign.
            // -PpaBenchHeap bounds it; -PpaBenchGcLog turns on GC logging so a
            // timing cell that overlapped a pause can be rejected after the fact.
            // Neither flag touches renderer, fixture or shader behaviour.
            if (project.hasProperty('paBenchHeap')) {
                jvmArgs '-Xms1G', "-Xmx${project.property('paBenchHeap')}".toString()
            }
            if (project.hasProperty('paBenchGcLog')) {
                jvmArg('-Xlog:gc*:file='
                        + rootProject.file(project.property('paBenchGcLog')).absolutePath
                        + ':time,uptime,level,tags')
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'

        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "projectatmosphere.refmap.json" // ⬅️ same as in mixins.json
    config 'projectatmosphere.mixins.json' // ⬅️ same as in mixins.json
}


repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
        content {
            includeGroupByRegex('net\\.minecraftforge.*')
            includeGroup('cpw.mods')
        }
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content {
            includeGroupByRegex('org\\.spongepowered.*')
        }
    }
    mavenCentral()
    maven { url "https://maven.blamejared.com/" }
    maven {
        url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        name "nonamecrackers2Maven"
        url "https://maven.nonamecrackers2.dev/releases"
    }
    maven { url "https://maven.theillusivec4.top/" }
    flatDir { dir 'libs' }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }


}


