// ---------------------------------------------------------------------------
// T161: compile-time FINAL shader specialization.
//
// The volumetric cloud raymarch is one source file that carries both the normal
// renderer and every dormant diagnostic, oracle, trace, legacy and alternate
// output path. Those paths are selected by uniforms, so a driver cannot prove
// them unreachable: it must keep their code, allocate registers for their live
// ranges, and preserve their control flow inside the hot march loop even though
// an ordinary frame never enters one.
//
// This task emits a second, separately linked program from the SAME source, with
// each diagnostic selector replaced by the exact constant an ordinary FINAL
// frame uploads. Every dormant path then becomes statically unreachable and is
// eliminated before register allocation. Nothing is deleted: the unmodified
// program is still compiled and is what every diagnostic campaign selects.
//
// The renderer must only bind the lean program on frames where these uniforms
// really would have carried these values; VolumetricCloudRenderer's
// leanFinalEligible() is the matching runtime predicate, and the two lists must
// be changed together.
// ---------------------------------------------------------------------------
def leanFinalShaderSource =
        file('src/main/resources/assets/projectatmosphere/shaders/core/cloud_atmosphere_volume.fsh')
def leanFinalShaderJson =
        file('src/main/resources/assets/projectatmosphere/shaders/core/cloud_atmosphere_volume.json')
def leanFinalGeneratedResources = layout.buildDirectory.dir('generated/leanFinalResources')
def leanFinalShaderName = 'cloud_atmosphere_volume_final'

// uniform declaration -> replacement declaration. The value on the right is the
// production value the renderer uploads for an ordinary FINAL frame; where a
// uniform is only read behind a diagnostic gate that is itself literalized off,
// the value is the shader's own inert default.
def leanFinalConstants = [
        'uniform int PaDiagnosticStepBudget;'      : 'const int PaDiagnosticStepBudget = 0;',
        'uniform int PuffDensityStage;'            : 'const int PuffDensityStage = 0;',
        'uniform int PuffTierFilter;'              : 'const int PuffTierFilter = -1;',
        'uniform int DebugView;'                   : 'const int DebugView = 0;',
        'uniform int PaDiagnosticOptimizationMode;': 'const int PaDiagnosticOptimizationMode = 0;',
        'uniform float PaDiagnosticEvalEpsilon;'   : 'const float PaDiagnosticEvalEpsilon = 0.0;',
        'uniform int PaOraclePass;'                : 'const int PaOraclePass = 0;',
        'uniform vec2 PaOracleBaseSize;'           : 'const vec2 PaOracleBaseSize = vec2(1.0);',
        'uniform vec2 StormTraceOrigin;'           : 'const vec2 StormTraceOrigin = vec2(0.0);',
        'uniform float StormTraceYStart;'          : 'const float StormTraceYStart = 0.0;',
        'uniform float StormTraceYInterval;'       : 'const float StormTraceYInterval = 1.0;',
        'uniform int StormTraceSamples;'           : 'const int StormTraceSamples = 2;',
        'uniform int StormTraceStage;'             : 'const int StormTraceStage = 0;',
        'uniform int PaLegacyHitDepth;'            : 'const int PaLegacyHitDepth = 0;',
        'uniform int PaLegacyFinePromotion;'       : 'const int PaLegacyFinePromotion = 0;',
        'uniform int PaDiagnosticLightingMode;'    : 'const int PaDiagnosticLightingMode = 0;',
        'uniform int PaRayTraceMode;'              : 'const int PaRayTraceMode = 0;',
        'uniform vec2 PaRayTraceNdc;'              : 'const vec2 PaRayTraceNdc = vec2(0.0);',
        'uniform vec2 PaRayTraceFragCoord;'        : 'const vec2 PaRayTraceFragCoord = vec2(0.0);',
        // T188. Every program that does not generate or read the rain
        // field bakes both to 0, so neither the generation pass above
        // main's march nor the lookup branch inside localRainSupportAt
        // is compiled into it. FINAL is therefore unchanged by T188.
        'uniform int PaRainFieldPass;'             : 'const int PaRainFieldPass = 0;',
        'uniform int PaRainFieldEnabled;'          : 'const int PaRainFieldEnabled = 0;',
        // T190. The certainty flag and its fallback are compiled out of
        // every program that does not opt in, so the mixed-cell branch
        // is absent rather than merely unentered.
        'uniform int PaRainFieldConservative;'     : 'const int PaRainFieldConservative = 0;'
]

// The oracle interval texture is read only by the T153 ground-truth replay,
// which PaOraclePass = 0 makes unreachable. The driver therefore drops the
// sampler entirely, so naming it in the lean JSON only produces a "could not
// find sampler" warning on every load. Its absence from the linked program is
// also the clearest single proof that the specialization really did eliminate
// the diagnostic paths rather than merely hide them.
def leanFinalRemovedSamplers = ['OracleIntervalSampler']

// The uniform names the lean program no longer declares. Minecraft binds every
// uniform named in the JSON, so the generated JSON must drop them; the renderer
// reaches them through safeGetUniform, which returns a dummy for an absent name.
def leanFinalRemovedUniforms = leanFinalConstants.keySet().collect {
    it.replaceAll(/^uniform\s+\w+\s+/, '').replaceAll(/;$/, '')
}

// T140 diagnostic variants. Each is the SAME lean specialization plus a
// preprocessor define that switches on the diagnostic-only whole-pixel
// rejection oracle. They are separate programs so FINAL never contains the
// oracle: the shipped program does not define PA_T140_ORACLE, so none of that
// code exists in it and the T161 specialization is unchanged.
//
// keepUniforms names constants the variant must NOT bake. The tile arms need
// the live cloud-target size to rebuild neighbouring rays, and PaOracleBaseSize
// already carries it every frame; PaOraclePass stays baked to 0, so the oracle
// capture path it normally serves remains dead.
def leanProgramVariants = [
        // T163: FINAL no longer carries the unreachable precipitation branch.
        //
        // T174 productionizes the T172 descriptor-invariant precompute.
        // PA_ARM_DESC_PRECOMPUTE makes the march read edge width and the
        // ownership radii out of descriptor texel 3 instead of deriving them
        // once per descriptor per density sample. The values are written by
        // StormLobeDescriptor.writePrecomputedInvariants when the descriptor is
        // built, and T172 proved the substitution bit-identical at both poses -
        // 0 changed pixels, maxAbsRGBA 0.0 - so this changes cost and nothing
        // else. T173 measured it at 1.133x on the binding SIDE pose.
        //
        // The define also removes the old derivation: the two are #if/#else
        // branches, so the recomputation is not compiled into FINAL at all
        // rather than being left live alongside the read.
        [name: leanFinalShaderName,
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: []],
        // The T140 oracle family must stay bit-for-bit equivalent to FINAL, so
        // it takes the same specialization - including the precompute, because
        // these programs can render production frames.
        [name: 'cloud_atmosphere_volume_t140_pixel',
         defines: ['PA_T140_ORACLE 1', 'PA_PRECIPITATION_ABSENT 1',
                   'PA_ARM_DESC_PRECOMPUTE 1'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t140_mask',
         defines: ['PA_T140_ORACLE 1', 'PA_T140_MASK 1', 'PA_PRECIPITATION_ABSENT 1',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t140_tile8',
         defines: ['PA_T140_ORACLE 1', 'PA_T140_TILE 8', 'PA_PRECIPITATION_ABSENT 1',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t140_tile16',
         defines: ['PA_T140_ORACLE 1', 'PA_T140_TILE 16', 'PA_PRECIPITATION_ABSENT 1',
                   'PA_ARM_DESC_PRECOMPUTE 1'],
         keepUniforms: ['PaOracleBaseSize']],
        // T174 control: FINAL with the precompute explicitly off. This is the
        // only way to A/B the productionized path against itself, and it is
        // what proves FINAL actually consumes the precomputed fields rather
        // than merely declaring the define.
        [name: 'cloud_atmosphere_volume_t174_no_precompute',
         defines: ['PA_PRECIPITATION_ABSENT 1'], keepUniforms: []],
        // The pre-T163 FINAL, kept so the optimization can be measured and
        // compared against back to back rather than against a remembered number.
        [name: 'cloud_atmosphere_volume_t163_withrain', defines: [], keepUniforms: []],
        // T162 production-context attribution arms. These render the real
        // raymarch; only one cost class is compiled out of each.
        [name: 'cloud_atmosphere_volume_t162_nolight', defines: [], keepUniforms: [],
         overrides: ['uniform int PaDiagnosticLightingMode;':
                     'const int PaDiagnosticLightingMode = 1;']],
        [name: 'cloud_atmosphere_volume_t162_norain',
         defines: ['PA_PRECIPITATION_ABSENT 1'], keepUniforms: []],
        // T162 fixed-work ladder. Every arm evaluates the same 64 points per
        // fragment, so the deltas between them are attributable.
        [name: 'cloud_atmosphere_volume_t162_fw1_address',
         defines: ['PA_T162_FIXED_WORK 1', 'PA_T162_ARM 1'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t162_fw2_candidate',
         defines: ['PA_T162_FIXED_WORK 1', 'PA_T162_ARM 2'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t162_fw3_descriptor',
         defines: ['PA_T162_FIXED_WORK 1', 'PA_T162_ARM 3'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t162_fw4_shape',
         defines: ['PA_T162_FIXED_WORK 1', 'PA_T162_ARM 4'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t162_fw5_nodetail',
         defines: ['PA_T162_FIXED_WORK 1', 'PA_T162_ARM 5'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t162_fw6_norain',
         defines: ['PA_T162_FIXED_WORK 1', 'PA_T162_ARM 6'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t162_fw7_density',
         defines: ['PA_T162_FIXED_WORK 1', 'PA_T162_ARM 7'], keepUniforms: []],

        // ------------------------------------------------------------------
        // T166 post-T163 attribution and PMWeather-idea arms.
        //
        // Every one of these carries PA_PRECIPITATION_ABSENT, so each is FINAL
        // minus exactly one thing. The T162 arms above do NOT carry it and are
        // therefore pre-T163 shaped; comparing one of them against today's
        // FINAL would attribute the removed rain-carry cost to whatever else
        // the arm changed. That is the specific trap this set exists to avoid.
        // ------------------------------------------------------------------

        // Production-context cost attribution.
        [name: 'cloud_atmosphere_volume_t166_nolight',
         defines: ['PA_PRECIPITATION_ABSENT 1'], keepUniforms: [],
         overrides: ['uniform int PaDiagnosticLightingMode;':
                     'const int PaDiagnosticLightingMode = 1;']],
        [name: 'cloud_atmosphere_volume_t166_nodetail',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_NO_DETAIL 1'], keepUniforms: []],

        // PM idea C - cheaper lighting density, one lever per arm.
        [name: 'cloud_atmosphere_volume_t166_lightnodetail',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_LIGHT_NO_DETAIL 1'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_lightsteps2',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_LIGHT_STEPS 2'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_lightwide',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_LIGHT_STEP_WIDE 1.6'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_lightearlyout',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_LIGHT_EARLY_OUT 3.0'], keepUniforms: []],
        // The combined PMWeather-shaped lighting evaluator.
        [name: 'cloud_atmosphere_volume_t166_lightcheap',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_LIGHT_CHEAP 1',
                   'PA_ARM_LIGHT_NO_DETAIL 1', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_LIGHT_EARLY_OUT 3.0'], keepUniforms: []],

        // PM ideas A, B, D, E, F.
        [name: 'cloud_atmosphere_volume_t166_diststep',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DISTANCE_STEP 1.0'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_emptyjump',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_EMPTY_JUMP 4.0'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_distlod',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DISTANCE_LOD 0.35'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_earlyterm',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_EARLY_TERM 0.06'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_noscenelimit',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_NO_SCENE_LIMIT 1'], keepUniforms: []],

        // Stacking arm. The only way to measure overlap rather than assume it.
        [name: 'cloud_atmosphere_volume_t166_stack',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_LIGHT_CHEAP 1',
                   'PA_ARM_LIGHT_NO_DETAIL 1', 'PA_ARM_LIGHT_STEPS 4',
                   'PA_ARM_LIGHT_EARLY_OUT 3.0', 'PA_ARM_DISTANCE_STEP 1.0',
                   'PA_ARM_DISTANCE_LOD 0.35'], keepUniforms: []],

        // Post-T163 fixed-work ladder. Identical control flow to the T162
        // ladder, but with the rain branch compiled out so the rungs describe
        // the density call production actually makes today.
        [name: 'cloud_atmosphere_volume_t166_fw1_address',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_T162_FIXED_WORK 1', 'PA_T162_ARM 1'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_fw2_candidate',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_T162_FIXED_WORK 1', 'PA_T162_ARM 2'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_fw3_descriptor',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_T162_FIXED_WORK 1', 'PA_T162_ARM 3'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_fw4_shape',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_T162_FIXED_WORK 1', 'PA_T162_ARM 4'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_fw5_nodetail',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_T162_FIXED_WORK 1', 'PA_T162_ARM 5'],
         keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t166_fw6_density',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_T162_FIXED_WORK 1', 'PA_T162_ARM 6'],
         keepUniforms: []],

        // T153 empty-space oracle, re-derived on a lean program. The historical
        // 1.63x was measured on the pre-T161 monolith and cannot be quoted as
        // current. These keep the oracle selector, its base size and its
        // interval sampler, because the capture pass and the timed replay both
        // run on this one program exactly as the monolith runs them.
        [name: 'cloud_atmosphere_volume_t166_oracle_empty',
         defines: ['PA_PRECIPITATION_ABSENT 1'],
         keepUniforms: ['PaOraclePass', 'PaOracleBaseSize'],
         keepSamplers: ['OracleIntervalSampler'],
         overrides: ['uniform int PaDiagnosticOptimizationMode;':
                     'const int PaDiagnosticOptimizationMode = 4096;']],
        [name: 'cloud_atmosphere_volume_t166_oracle_intervals',
         defines: ['PA_PRECIPITATION_ABSENT 1'],
         keepUniforms: ['PaOraclePass', 'PaOracleBaseSize'],
         keepSamplers: ['OracleIntervalSampler'],
         overrides: ['uniform int PaDiagnosticOptimizationMode;':
                     'const int PaDiagnosticOptimizationMode = 8192;']],
        [name: 'cloud_atmosphere_volume_t166_oracle_combined',
         defines: ['PA_PRECIPITATION_ABSENT 1'],
         keepUniforms: ['PaOraclePass', 'PaOracleBaseSize'],
         keepSamplers: ['OracleIntervalSampler'],
         overrides: ['uniform int PaDiagnosticOptimizationMode;':
                     'const int PaDiagnosticOptimizationMode = 28672;']],

        // ------------------------------------------------------------------
        // T167. Three independent questions, measured separately before any
        // combination: a graded replacement for T166's over-aggressive
        // distance step, a nearest-K cap on descriptor owners, and a safer
        // early-termination threshold.
        //
        // Every arm carries PA_PRECIPITATION_ABSENT, so each is FINAL minus
        // exactly one thing, on the same terms as the T166 set.
        // ------------------------------------------------------------------

        // Task 1. Graded exterior fine-step curves. Each keeps PaOracleBaseSize
        // as a uniform because the footprint curve needs the live cloud-target
        // height, and the renderer uploads it on every frame.
        [name: 'cloud_atmosphere_volume_t167_curve_a_late',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_STEP_CURVE 1'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t167_curve_b_smooth',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_STEP_CURVE 2'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t167_curve_c_capped',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_STEP_CURVE 3'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t167_curve_d_footprint',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_STEP_CURVE 4'],
         keepUniforms: ['PaOracleBaseSize']],
        // The same footprint curve with the empty-span scan held at production
        // spacing, to separate scan-lattice misses from coarser integration as
        // the source of the thin-material loss.
        [name: 'cloud_atmosphere_volume_t167_curve_d_scanfixed',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_STEP_CURVE 4',
                   'PA_ARM_SCAN_LATTICE_FIXED 1'],
         keepUniforms: ['PaOracleBaseSize']],

        // Task 2. Nearest-K descriptor owner cap.
        [name: 'cloud_atmosphere_volume_t167_k1',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESCRIPTOR_K 1'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t167_k2',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESCRIPTOR_K 2'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t167_k3',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESCRIPTOR_K 3'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t167_k4',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESCRIPTOR_K 4'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t167_k6',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_DESCRIPTOR_K 6'], keepUniforms: []],

        // Task 3. Safer early-termination thresholds. Production is 0.015 and
        // T166 measured 0.06; these fill the interval.
        [name: 'cloud_atmosphere_volume_t167_term030',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_EARLY_TERM 0.030'], keepUniforms: []],
        [name: 'cloud_atmosphere_volume_t167_term045',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_EARLY_TERM 0.045'], keepUniforms: []],

        // Task 4. The combined stacks. Descriptor nearest-K is deliberately
        // absent: it was slower than FULL at every K measured, so there is
        // nothing to combine.
        //
        // BALANCED keeps the footprint curve's integration growth but holds the
        // empty-span scan at production spacing, which is where most of the
        // thin-material loss was traced to, and adds the safer termination
        // floor.
        [name: 'cloud_atmosphere_volume_t167_stack_balanced',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_STEP_CURVE 4',
                   'PA_ARM_SCAN_LATTICE_FIXED 1', 'PA_ARM_EARLY_TERM 0.045'],
         keepUniforms: ['PaOracleBaseSize']],
        // SAFE takes the late-ramp curve, which recovered essentially all thin
        // material, and the same termination floor.
        [name: 'cloud_atmosphere_volume_t167_stack_safe',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_STEP_CURVE 1',
                   'PA_ARM_EARLY_TERM 0.045'],
         keepUniforms: ['PaOracleBaseSize']],

        // ------------------------------------------------------------------
        // T168 footprint step LOD. PA_ARM_FOOTPRINT is the target sample
        // spacing in cloud-target pixels; the growth it implies is linear in
        // ray distance, so the march loop pays one multiply and one clamp.
        // PaOracleBaseSize carries the live cloud-target height the derivation
        // needs and must survive specialization.
        // ------------------------------------------------------------------
        [name: 'cloud_atmosphere_volume_t168_fp_conservative',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.35',
                   'PA_ARM_FOOTPRINT_MAX 4.0'],
         keepUniforms: ['PaOracleBaseSize']],
        [name: 'cloud_atmosphere_volume_t168_fp_balanced',
         defines: ['PA_PRECIPITATION_ABSENT 1', 'PA_ARM_FOOTPRINT 0.50',
                   'PA_ARM_FOOTPRINT_MAX 4.0'],
